name: Browser smoke checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save playwright@1.58.2
      # Ubuntu 24.04 is supported by the pinned Playwright version; ubuntu-latest resolved to 26.04 and failed.
      - run: npx playwright install --with-deps chromium
      - name: Serve static site
        run: python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
      - name: Browser smoke tests
        run: node scripts/browser-smoke.cjs
